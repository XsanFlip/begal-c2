<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GarudaVPN • Indonesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════
           BROWSER ADDON: fixed 380×580px canvas
           Tidak ada scrolling di body/html
           Semua elemen mengisi ruang proporsional
        ═══════════════════════════════════════ */

        :root {
            --red:    #e30613;
            --red-dim: rgba(227,6,19,0.18);
            --red-glow: rgba(227,6,19,0.30);
            --dark:   #08090f;
            --dark2:  #0d0f1b;
            --dark3:  #131627;
            --b2:     rgba(255,255,255,0.055);
            --b3:     rgba(255,255,255,0.09);
            --mono:   'JetBrains Mono', monospace;
            --hud:    'Orbitron', sans-serif;
            --body:   'Rajdhani', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 380px;
            height: 580px;
            overflow: hidden;        /* NO scroll on body — addon rule */
            background: var(--dark);
            color: #fff;
            font-family: var(--body);
            user-select: none;
        }

        /* Noise grain */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 9998; opacity: 0.45;
        }

        /* ── SHELL ── */
        .shell {
            width: 380px;
            height: 580px;
            background: var(--dark2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--red-dim);
        }

        /* Corner brackets */
        .c { position: absolute; width: 14px; height: 14px; z-index: 20; }
        .c-tl { top:0; left:0;  border-top:2px solid var(--red); border-left:2px solid var(--red); }
        .c-tr { top:0; right:0; border-top:2px solid var(--red); border-right:2px solid var(--red); }
        .c-bl { bottom:0; left:0;  border-bottom:2px solid var(--red); border-left:2px solid var(--red); }
        .c-br { bottom:0; right:0; border-bottom:2px solid var(--red); border-right:2px solid var(--red); }

        /* Red grid backdrop */
        .grid-bg {
            position: absolute; inset: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(227,6,19,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(227,6,19,0.035) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* ── HEADER ZONE (fixed height) ── */
        .hdr {
            flex-shrink: 0;
            padding: 14px 16px 12px;
            background: linear-gradient(160deg, #0d0f1b 0%, #060709 100%);
            border-bottom: 1px solid var(--red-dim);
            position: relative;
            overflow: hidden;
        }

        .hdr::before {
            content: '';
            position: absolute; top: -50px; right: -50px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(227,6,19,0.16) 0%, transparent 65%);
            pointer-events: none;
        }

        /* Logo row */
        .logo-row {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 10px; position: relative; z-index: 2;
        }

        .logo-icon {
            width: 38px; height: 38px; flex-shrink: 0;
            background: linear-gradient(135deg, #1a0005, #280008);
            border: 1px solid rgba(227,6,19,0.5);
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 10px rgba(227,6,19,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .logo-text { line-height: 1; }

        .logo-name {
            font-family: var(--hud);
            font-size: 17px; font-weight: 900;
            letter-spacing: 2px; color: #fff;
        }
        .logo-name span { color: var(--red); }

        .logo-sub {
            font-family: var(--mono);
            font-size: 7.5px; color: rgba(255,255,255,0.28);
            letter-spacing: 1.2px; text-transform: uppercase; margin-top: 3px;
        }

        /* Scanline */
        .scanline {
            height: 1px; width: 100%;
            background: linear-gradient(90deg, transparent, var(--red), rgba(255,255,255,0.35), var(--red), transparent);
            margin-bottom: 10px; position: relative; z-index: 2;
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan { 0%,100%{opacity:.35} 50%{opacity:1} }

        /* Status card */
        #status-card {
            position: relative; z-index: 2;
            background: rgba(255,255,255,0.035);
            border: 1px solid var(--red-dim);
            border-radius: 12px;
            padding: 10px 13px;
            margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
        }
        #status-card::before {
            content: '';
            position: absolute; top:0; left:0; right:0; height:1px;
            background: linear-gradient(90deg, transparent, rgba(227,6,19,0.45), transparent);
            border-radius: 12px 12px 0 0;
        }

        .st-left { display: flex; align-items: center; gap: 9px; }

        #status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--red); flex-shrink: 0;
            box-shadow: 0 0 0 3px rgba(227,6,19,0.18);
            animation: pdot 1.5s ease-in-out infinite;
        }
        @keyframes pdot {
            0%,100%{ box-shadow: 0 0 0 3px rgba(227,6,19,0.18); }
            50%     { box-shadow: 0 0 0 6px rgba(227,6,19,0.06); }
        }

        #connection-status {
            font-family: var(--hud); font-size: 11px;
            font-weight: 700; letter-spacing: 0.5px;
        }
        #current-ip {
            font-family: var(--mono); font-size: 9.5px;
            color: rgba(255,255,255,0.3); margin-top: 1px;
        }

        .st-right { text-align: right; }
        .st-right .lbl {
            font-family: var(--mono); font-size: 7.5px;
            color: #34d399; letter-spacing: 1px;
            text-transform: uppercase; margin-bottom: 2px;
        }
        #server-name {
            font-family: var(--hud); font-size: 10px;
            font-weight: 700; letter-spacing: 0.5px; color: #fff;
        }

        /* Connect button */
        #connect-btn {
            width: 100%; position: relative; z-index: 2;
            padding: 14px 16px;
            border-radius: 13px;
            background: linear-gradient(135deg, #b0000e 0%, #e30613 45%, #ff1f2e 100%);
            border: 1px solid rgba(255,70,70,0.25);
            color: #fff; cursor: pointer;
            font-family: var(--hud); font-size: 12px;
            font-weight: 700; letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            overflow: hidden;
            transition: transform .3s, box-shadow .3s;
            box-shadow: 0 6px 24px rgba(227,6,19,0.38), 0 2px 6px rgba(0,0,0,0.55),
                        inset 0 1px 0 rgba(255,255,255,0.14);
        }
        #connect-btn::before {
            content: '';
            position: absolute; top:0; left:-100%; width:100%; height:100%;
            background: linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
            transition: left .45s ease;
        }
        #connect-btn:hover::before { left: 100%; }
        #connect-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 32px rgba(227,6,19,0.52), 0 3px 10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.18); }
        #connect-btn:active { transform: scale(0.97); }

        #connect-btn.connected {
            background: linear-gradient(135deg, #053d1c 0%, #0a6030 45%, #0e7a3c 100%);
            border-color: rgba(52,211,153,0.3);
            animation: glow-green 2s ease-in-out infinite alternate;
            box-shadow: 0 6px 24px rgba(52,211,153,0.3), 0 2px 6px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        @keyframes glow-green {
            from { box-shadow: 0 6px 24px rgba(52,211,153,0.25), 0 2px 6px rgba(0,0,0,0.55); }
            to   { box-shadow: 0 8px 36px rgba(52,211,153,0.5),  0 2px 6px rgba(0,0,0,0.55); }
        }

        .btn-icon-wrap {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(0,0,0,0.22);
            border: 1px solid rgba(255,255,255,0.13);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        #btn-icon { font-size: 16px; }

        /* Stats strip */
        .stats-strip {
            display: flex; justify-content: space-around;
            margin-top: 10px; position: relative; z-index: 2;
            background: rgba(0,0,0,0.22);
            border: 1px solid var(--b2); border-radius: 11px; padding: 10px 0;
        }
        .stat-item { text-align: center; }
        .stat-val {
            font-family: var(--mono); font-size: 15px;
            font-weight: 700; line-height: 1; margin-bottom: 1px;
        }
        .stat-lbl {
            font-family: var(--mono); font-size: 7.5px;
            color: rgba(255,255,255,0.28); letter-spacing: 1px; text-transform: uppercase;
        }
        .stat-sep { width:1px; background: var(--b2); align-self: stretch; }

        /* ── BODY ZONE (flex-grow, scrollable internally) ── */
        .body-zone {
            flex: 1 1 0;
            overflow: hidden;           /* body zone itself no overflow */
            display: flex;
            flex-direction: column;
            padding: 10px 14px 0;
        }

        /* Section header */
        .sec-hdr {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 8px; flex-shrink: 0;
        }
        .sec-title {
            font-family: var(--hud); font-size: 9px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            display: flex; align-items: center; gap: 7px;
        }
        .sec-title::before {
            content: ''; display: block;
            width: 3px; height: 12px;
            background: var(--red); border-radius: 2px;
        }

        #refresh-btn {
            font-family: var(--mono); font-size: 8.5px;
            color: rgba(255,255,255,0.28);
            background: none; border: 1px solid var(--b2);
            border-radius: 7px; padding: 4px 9px; cursor: pointer;
            display: flex; align-items: center; gap: 4px;
            letter-spacing: 0.4px; transition: all .2s;
        }
        #refresh-btn:hover { color: var(--red); border-color: var(--red-dim); background: rgba(227,6,19,0.07); }

        /* Server list — internal scroll */
        #server-list {
            flex: 1 1 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 2px;
        }
        #server-list::-webkit-scrollbar { width: 3px; }
        #server-list::-webkit-scrollbar-track { background: transparent; }
        #server-list::-webkit-scrollbar-thumb { background: var(--red-dim); border-radius: 2px; }

        /* Server cards from popup.js — style override */
        .server-card {
            position: relative;
            background: rgba(255,255,255,0.03) !important;
            border: 1px solid var(--b2) !important;
            border-radius: 11px !important;
            padding: 10px 12px !important;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all .22s ease !important;
            overflow: hidden;
        }
        .server-card::before {
            content: ''; position: absolute;
            left:0; top:0; bottom:0; width:3px;
            background: var(--red); border-radius: 3px 0 0 3px;
            transform: scaleY(0); transform-origin: center;
            transition: transform .22s ease;
        }
        .server-card:hover {
            border-color: var(--red-dim) !important;
            background: rgba(227,6,19,0.06) !important;
            transform: translateX(3px) !important;
            box-shadow: none !important;
        }
        .server-card:hover::before { transform: scaleY(1); }
        .server-card.active {
            border-color: rgba(227,6,19,0.38) !important;
            background: rgba(227,6,19,0.1) !important;
        }
        .server-card.active::before { transform: scaleY(1); }

        /* Divider */
        .divider {
            flex-shrink: 0;
            height: 1px; margin: 8px 0;
            background: linear-gradient(90deg, transparent, var(--b2), transparent);
        }

        /* Quick stats grid */
        .qs-grid {
            flex-shrink: 0;
            display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
            margin-bottom: 10px;
        }
        .qs-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--b2); border-radius: 11px;
            padding: 11px 6px; text-align: center; position: relative; overflow: hidden;
            transition: border-color .2s;
        }
        .qs-card:hover { border-color: var(--b3); }
        .qs-card::after {
            content: ''; position: absolute;
            bottom:0; left:0; right:0; height:2px;
            border-radius: 0 0 11px 11px;
        }
        .qs-card.green::after { background: linear-gradient(90deg,transparent,#34d399,transparent); }
        .qs-card.blue::after  { background: linear-gradient(90deg,transparent,#38bdf8,transparent); }
        .qs-card.amber::after { background: linear-gradient(90deg,transparent,#fbbf24,transparent); }

        .qs-icon { font-size: 16px; margin-bottom: 5px; }
        .qs-lbl  { font-family: var(--mono); font-size: 7px; color: rgba(255,255,255,0.28); letter-spacing:.9px; text-transform: uppercase; margin-bottom: 3px; }
        .qs-val  { font-family: var(--hud); font-size: 10px; font-weight: 700; letter-spacing:.4px; }

        /* ── FOOTER (fixed height) ── */
        .footer {
            flex-shrink: 0;
            padding: 9px 14px;
            border-top: 1px solid var(--b2);
            background: rgba(0,0,0,0.28);
            display: flex; align-items: center; justify-content: space-between;
        }

        .ftr-icons { display: flex; gap: 6px; }
        .ftr-icon {
            width: 30px; height: 30px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--b2); border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.3); text-decoration: none;
            font-size: 12px; transition: all .2s;
        }
        .ftr-icon:hover { background: rgba(227,6,19,0.1); border-color: var(--red-dim); color: var(--red); }

        .ver {
            display: flex; align-items: center; gap: 5px;
            font-family: var(--mono); font-size: 8px;
            color: rgba(255,255,255,0.18); letter-spacing: .4px;
        }
        .ver-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 5px #34d399;
            animation: pdot 2s ease-in-out infinite;
        }

        #killswitch-btn {
            font-family: var(--mono); font-size: 8px; letter-spacing: .5px;
            padding: 6px 10px; border-radius: 9px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--b2);
            color: rgba(255,255,255,0.35);
            cursor: pointer; display: flex; align-items: center; gap: 5px;
            transition: all .2s;
        }
        #killswitch-btn:hover { background: rgba(227,6,19,0.1); border-color: var(--red-dim); color: #ff4455; }

        /* Toast */
        #toast {
            font-family: var(--mono); font-size: 10px; letter-spacing: .4px;
            border-radius: 11px; padding: 10px 16px;
            background: rgba(10,11,18,0.96);
            border: 1px solid var(--red-dim);
            backdrop-filter: blur(14px);
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="shell">
    <!-- Corner brackets -->
    <div class="c c-tl"></div>
    <div class="c c-tr"></div>
    <div class="c c-bl"></div>
    <div class="c c-br"></div>

    <!-- ══════════ HEADER ══════════ -->
    <div class="hdr">
        <div class="grid-bg"></div>

        <!-- Logo -->
        <div class="logo-row">
            <div class="logo-icon">🦅</div>
            <div class="logo-text">
                <div class="logo-name">GARUDA<span>VPN</span></div>
                <div class="logo-sub">Lindungi • Cepat • Aman</div>
            </div>
        </div>

        <div class="scanline"></div>

        <!-- Status Card -->
        <div id="status-card">
            <div class="st-left">
                <div id="status-dot"></div>
                <div>
                    <div id="connection-status">Terputus</div>
                    <div id="current-ip">192.168.1.1</div>
                </div>
            </div>
            <div class="st-right">
                <div class="lbl">Server Indonesia</div>
                <div id="server-name">Jakarta • ID-01</div>
            </div>
        </div>

        <!-- Connect Button -->
        <button id="connect-btn" class="connect-btn">
            <div class="btn-icon-wrap">
                <i id="btn-icon" class="fa-solid fa-power-off"></i>
            </div>
            <span id="btn-text">HUBUNGKAN SEKARANG</span>
        </button>

        <!-- Stats Strip -->
        <div class="stats-strip">
            <div class="stat-item">
                <div class="stat-val" id="ping" style="color:#34d399">24</div>
                <div class="stat-lbl">PING ms</div>
            </div>
            <div class="stat-sep"></div>
            <div class="stat-item">
                <div class="stat-val" id="download" style="color:#38bdf8">0</div>
                <div class="stat-lbl">DOWN Mbps</div>
            </div>
            <div class="stat-sep"></div>
            <div class="stat-item">
                <div class="stat-val" id="upload" style="color:#fbbf24">0</div>
                <div class="stat-lbl">UP Mbps</div>
            </div>
        </div>
    </div>

    <!-- ══════════ BODY ══════════ -->
    <div class="body-zone">

        <!-- Server list header -->
        <div class="sec-hdr">
            <div class="sec-title">
                <i class="fa-solid fa-server" style="color:var(--red);font-size:9px;"></i>
                Pilih Server
            </div>
            <button id="refresh-btn">
                <i class="fa-solid fa-rotate"></i>
                REFRESH
            </button>
        </div>

        <!-- Server list (scrollable) -->
        <div id="server-list">
            <!-- Populated by popup.js -->
        </div>

        <div class="divider"></div>

        <!-- Quick Stats -->
        <div class="qs-grid">
            <div class="qs-card green">
                <div class="qs-icon" style="color:#34d399"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="qs-lbl">Keamanan</div>
                <div class="qs-val" style="color:#34d399">AES-256</div>
            </div>
            <div class="qs-card blue">
                <div class="qs-icon" style="color:#38bdf8"><i class="fa-solid fa-globe"></i></div>
                <div class="qs-lbl">Lokasi</div>
                <div class="qs-val" style="color:#fff">Jakarta</div>
            </div>
            <div class="qs-card amber">
                <div class="qs-icon" style="color:#fbbf24"><i class="fa-solid fa-clock"></i></div>
                <div class="qs-lbl">Uptime</div>
                <div class="qs-val" id="uptime" style="color:#fbbf24">99.98%</div>
            </div>
        </div>
    </div>

    <!-- ══════════ FOOTER ══════════ -->
    <div class="footer">
        <div class="ftr-icons">
            <a href="#" id="settings-link" class="ftr-icon"><i class="fa-solid fa-gear"></i></a>
            <a href="#" id="info-link"     class="ftr-icon"><i class="fa-solid fa-circle-info"></i></a>
        </div>

        <div class="ver">
            <span class="ver-dot"></span>
            GarudaVPN v2.4.1
        </div>

        <button id="killswitch-btn">
            <i class="fa-solid fa-skull-crossbones"></i>
            KILL SWITCH
        </button>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-3 transition-all duration-300">
    <i id="toast-icon" class="fa-solid fa-circle-info" style="color:#34d399"></i>
    <span id="toast-text"></span>
</div>

<script src="popup.js"></script>
</body>
</html>
